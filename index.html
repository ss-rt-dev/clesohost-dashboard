<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cleso Host</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#050505;--elev:#0c0c14;--card:#111119;--card2:#16161f;--text:#fff;--muted:#94a3b8;--dim:#64748b;--accent:#2563eb;--accent2:#3b82f6;--soft:rgba(37,99,235,.12);--glow:rgba(37,99,235,.35);--border:rgba(255,255,255,.08);--ok:#22c55e;--bad:#ef4444;--radius:9999px;--rmd:14px;--font:Figtree,system-ui,sans-serif;--side:258px}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 85% -5%,rgba(37,99,235,.12),transparent 55%),radial-gradient(ellipse 50% 40% at 5% 100%,rgba(37,99,235,.05),transparent 50%);pointer-events:none;z-index:0}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 36px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);display:grid;place-items:center;font-weight:800;box-shadow:0 0 28px var(--glow)}.brand strong{font-size:18px}.brand span{color:var(--accent2)}
h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-bottom:6px}.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,select,textarea{width:100%;background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);font:inherit;font-size:14px;outline:none;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}textarea{min-height:80px;resize:vertical}
.err{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}.err.show{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:none;border-radius:var(--radius);font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:.2s}
.btn-p{background:var(--accent);color:#fff;width:100%}.btn-p:hover{background:var(--accent2);box-shadow:0 8px 28px -4px var(--glow);transform:translateY(-1px)}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-g:hover{border-color:rgba(37,99,235,.35);color:var(--text);background:var(--soft)}.btn-sm{padding:7px 12px;font-size:12.5px}
.switch{text-align:center;margin-top:18px;font-size:14px;color:var(--muted)}.switch a{color:var(--accent2);font-weight:600;text-decoration:none}
.app{display:none;min-height:100vh;position:relative;z-index:1}.app.on{display:flex}
.side{width:var(--side);background:var(--elev);border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:50;transition:transform .28s}
.side-h{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.nav{flex:1;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);padding:12px 10px 6px}
.nav-b{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:none;background:0;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer;width:100%;text-align:left}
.nav-b:hover{background:var(--soft);color:var(--text)}.nav-b.on{background:var(--soft);color:var(--accent2)}
.side-f{padding:12px 10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.chip{flex:1;display:flex;align-items:center;gap:10px;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:0}
.av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1e40af);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.chip .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip .r{font-size:11px;color:var(--dim)}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:0;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex-shrink:0;font-size:16px}.ib:hover{border-color:var(--bad);color:var(--bad)}
.main{flex:1;margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(5,5,5,.75);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
.mt{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:0;color:var(--text);cursor:pointer;place-items:center;font-size:16px}
.pt{font-size:16px;font-weight:700;letter-spacing:-.3px;flex:1}
.content{padding:24px;max-width:1100px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--rmd);padding:16px 18px;transition:.2s}.stat:hover{border-color:rgba(37,99,235,.3);transform:translateY(-2px)}
.sl{font-size:12px;color:var(--muted);margin-bottom:6px}.sv{font-size:22px;font-weight:700;letter-spacing:-.4px}.sv small{font-size:12px;font-weight:500;color:var(--dim);margin-left:3px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}.st{font-size:15px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden}.pad{padding:18px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.25)}td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius);font-size:12px;font-weight:600}
.bon{background:rgba(34,197,94,.12);color:var(--ok)}.boff{background:rgba(239,68,68,.12);color:var(--bad)}.bbl{background:var(--soft);color:var(--accent2)}.bpu{background:rgba(168,85,247,.15);color:#c084fc}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.srv{background:var(--card);border:1px solid var(--border);border-radius:var(--rmd);padding:16px;transition:.2s}.srv:hover{border-color:rgba(37,99,235,.3);background:var(--card2);transform:translateY(-2px)}
.srt{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}.sn{font-size:15px;font-weight:600}.sid{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
.mx{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}.m{background:var(--elev);border-radius:8px;padding:8px}.ml{font-size:10px;text-transform:uppercase;color:var(--dim);margin-bottom:2px}.mv{font-size:13px;font-weight:600}
.bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.sa{display:flex;gap:6px}.sa .btn{flex:1;padding:7px;font-size:12px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty h3{color:var(--text);font-size:16px;margin-bottom:6px}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:420px;padding:24px}.mod h2{font-size:17px;margin-bottom:6px}.mod>p{color:var(--muted);font-size:13px;margin-bottom:14px}.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--card);border:1px solid var(--border);padding:12px 20px;border-radius:var(--radius);font-size:14px;font-weight:500;z-index:200;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}.ov.open{display:block}
.staff{display:none!important}body.is-staff .staff{display:flex!important}body.is-staff .nav-l.staff{display:block!important}
.chat{display:flex;flex-direction:column;height:380px}.cl{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.cr{display:flex;gap:10px}.cr .av{width:28px;height:28px;font-size:11px}
.ci{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}.ci input{flex:1;margin:0}.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:translateX(0)}.main{margin-left:0}.mt{display:grid}.content{padding:18px 14px 64px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.sg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="brand"><div class="mark">C</div><div><strong>Cleso</strong> <span>Host</span></div></div>
    <div id="v-login">
      <h1>Anmelden</h1>
      <p class="sub">Zugang zu deinem Panel</p>
      <div class="err" id="e1"></div>
      <label>E-Mail</label><input type="email" id="email" autocomplete="username" placeholder="name@domain.de"/>
      <label>Passwort</label><input type="password" id="pass" autocomplete="current-password" placeholder="••••••••"/>
      <button class="btn btn-p" type="button" id="btn-login">Anmelden</button>
      <p class="switch">Noch kein Konto? <a href="#" id="to-reg">Registrieren</a></p>
    </div>
    <div id="v-reg" style="display:none">
      <h1>Registrieren</h1>
      <p class="sub">Account erstellen</p>
      <div class="err" id="e2"></div>
      <label>Name</label><input type="text" id="rname" placeholder="Dein Name"/>
      <label>E-Mail</label><input type="email" id="remail" placeholder="name@domain.de"/>
      <label>Passwort</label><input type="password" id="rpass" placeholder="Min. 6 Zeichen"/>
      <button class="btn btn-p" type="button" id="btn-reg">Konto erstellen</button>
      <p class="switch">Bereits registriert? <a href="#" id="to-login">Anmelden</a></p>
    </div>
  </div>
</div>
<div id="app" class="app">
  <aside class="side" id="side">
    <div class="side-h"><div class="brand" style="margin:0"><div class="mark">C</div><div><strong>Cleso</strong> <span>Host</span></div></div></div>
    <nav class="nav">
      <div class="nav-l">Übersicht</div>
      <button class="nav-b on" data-p="dashboard">Dashboard</button>
      <button class="nav-b" data-p="servers">Server</button>
      <div class="nav-l staff">Team</div>
      <button class="nav-b staff" data-p="team">Team & Rollen</button>
      <button class="nav-b staff" data-p="users">Nutzer & Credits</button>
      <div class="nav-l">Support</div>
      <button class="nav-b" data-p="tickets">Tickets</button>
      <button class="nav-b" data-p="messages">Nachrichten</button>
      <div class="nav-l">Account</div>
      <button class="nav-b" data-p="credits">Guthaben</button>
      <button class="nav-b" data-p="settings">Einstellungen</button>
    </nav>
    <div class="side-f">
      <div class="chip"><div class="av" id="av">?</div><div style="min-width:0"><div class="n" id="cn">—</div><div class="r" id="cr">—</div></div></div>
      <button class="ib" id="btn-out" title="Abmelden">⎋</button>
    </div>
  </aside>
  <div class="ov" id="ov"></div>
  <main class="main">
    <header class="top">
      <button class="mt" id="mt" type="button">☰</button>
      <div class="pt" id="pt">Dashboard</div>
      <button class="btn btn-g btn-sm" type="button" id="btn-ref">Aktualisieren</button>
    </header>
    <div class="content" id="ct"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>

(function(){
const ROLES={owner:{l:"Inhaber",c:"bpu"},admin:{l:"Admin",c:"bbl"},technical:{l:"Technical",c:"bbl"},developer:{l:"Developer",c:"bbl"},user:{l:"Kunde",c:"bbl"}};
const STAFF=["owner","admin","technical","developer"];
const S={get(k,f){try{const v=localStorage.getItem("cleso_"+k);return v?JSON.parse(v):f}catch{return f}},set(k,v){localStorage.setItem("cleso_"+k,JSON.stringify(v))},del(k){localStorage.removeItem("cleso_"+k)}};
function ensure(){let u=S.get("users",[]);if(!u.length){u=[{id:"u1",name:"Justin",email:"justin@cleso-host.com",password:"admin123",role:"owner",balance:0}];S.set("users",u)}return u}
function users(){return S.get("users",[])}
function saveU(u){S.set("users",u)}
function sess(){return S.get("session")}
function setSess(u){const{password,...s}=u;S.set("session",s)}
function clrSess(){S.del("session")}
function find(e){return users().find(u=>u.email.toLowerCase()===e.toLowerCase())}
function me(){const s=sess();if(!s)return null;return users().find(u=>u.id===s.id)||null}
function isStaff(u=me()){return u&&STAFF.includes(u.role)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
const PTERO={baseUrl:"",apiKey:"",async power(id,sig){if(!this.baseUrl||!this.apiKey)return;try{await fetch(this.baseUrl+"/api/client/servers/"+id+"/power",{method:"POST",headers:{Authorization:"Bearer "+this.apiKey,"Content-Type":"application/json",Accept:"application/vnd.pterodactyl.v1+json"},body:JSON.stringify({signal:sig})})}catch(e){console.warn(e)}}};
const SRV=[{id:"srv1",name:"Minecraft Survival",status:"running",cpu:38,memory:{used:3.1,limit:8},disk:{used:11.2,limit:50}},{id:"srv2",name:"CS2 Competitive",status:"running",cpu:22,memory:{used:1.6,limit:4},disk:{used:5.4,limit:30}},{id:"srv3",name:"Valheim World",status:"offline",cpu:0,memory:{used:0,limit:6},disk:{used:4.1,limit:40}}];
function card(s){const on=s.status==="running";const mp=s.memory.limit?Math.round(s.memory.used/s.memory.limit*100):0;const dp=s.disk.limit?Math.round(s.disk.used/s.disk.limit*100):0;return`<div class="srv"><div class="srt"><div><div class="sn">${esc(s.name)}</div><div class="sid">#${s.id}</div></div><span class="badge ${on?"bon":"boff"}"><span class="dot"></span>${on?"Online":"Offline"}</span></div><div class="mx"><div class="m"><div class="ml">CPU</div><div class="mv">${s.cpu}%</div><div class="bar"><i style="width:${s.cpu}%"></i></div></div><div class="m"><div class="ml">RAM</div><div class="mv">${s.memory.used}/${s.memory.limit}G</div><div class="bar"><i style="width:${mp}%"></i></div></div><div class="m"><div class="ml">Disk</div><div class="mv">${s.disk.used}/${s.disk.limit}G</div><div class="bar"><i style="width:${dp}%"></i></div></div></div><div class="sa"><button class="btn btn-g" data-pw="${s.id}" data-sg="start">Start</button><button class="btn btn-g" data-pw="${s.id}" data-sg="restart">Restart</button><button class="btn btn-g" data-pw="${s.id}" data-sg="stop">Stop</button></div></div>`}
function pDash(){const on=SRV.filter(s=>s.status==="running").length;const cpu=Math.round(SRV.reduce((a,s)=>a+s.cpu,0)/SRV.length);const ram=SRV.reduce((a,s)=>a+s.memory.used,0).toFixed(1);const u=me();return`<div class="stats"><div class="stat"><div class="sl">Aktive Server</div><div class="sv">${on}<small>/ ${SRV.length}</small></div></div><div class="stat"><div class="sl">Ø CPU</div><div class="sv">${cpu}<small>%</small></div></div><div class="stat"><div class="sl">RAM</div><div class="sv">${ram}<small>GB</small></div></div><div class="stat"><div class="sl">Credits</div><div class="sv">${(u?.balance||0).toFixed(0)}</div></div></div><div class="sh"><div class="st">Server</div></div><div class="sg">${SRV.map(card).join("")}</div>`}
function pSrv(){return`<div class="sh"><div class="st">Server</div></div><div class="sg">${SRV.map(card).join("")}</div>`}
function pTeam(){const list=users().filter(u=>STAFF.includes(u.role));const self=me();return`<div class="sh"><div class="st">Team & Rollen</div>${self?.role==="owner"?`<button class="btn btn-p btn-sm" id="add-staff" style="width:auto">+ Mitglied</button>`:""}</div><div class="card"><table><thead><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th></th></tr></thead><tbody>${list.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td style="color:var(--muted)">${esc(u.email)}</td><td><span class="badge ${ROLES[u.role]?.c||"bbl"}">${ROLES[u.role]?.l||u.role}</span></td><td>${self?.role==="owner"&&u.id!==self.id?`<select data-ru="${u.id}" style="background:var(--elev);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:8px;font:inherit;font-size:13px">${["admin","technical","developer"].map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${ROLES[r].l}</option>`).join("")}</select>`:""}</td></tr>`).join("")}</tbody></table></div>`}
function pUsers(){const list=users();const self=me();return`<div class="sh"><div class="st">Nutzer & Credits</div></div><div class="card"><table><thead><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th>Credits</th><th></th></tr></thead><tbody>${list.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td style="color:var(--muted)">${esc(u.email)}</td><td><span class="badge ${ROLES[u.role]?.c||"bbl"}">${ROLES[u.role]?.l||u.role}</span></td><td><strong>${(u.balance||0).toFixed(0)}</strong></td><td>${self?.role==="owner"||self?.role==="admin"?`<button class="btn btn-g btn-sm" data-cr="${u.id}">Credits</button>`:""}</td></tr>`).join("")}</tbody></table></div>`}
function pCredits(){const u=me();return`<div class="sh"><div class="st">Guthaben</div></div><div class="stats"><div class="stat"><div class="sl">Deine Credits</div><div class="sv">${(u?.balance||0).toFixed(0)}</div></div></div><div class="card pad"><p style="color:var(--muted);font-size:14px;line-height:1.6"><strong style="color:var(--text)">Kein Echtgeld.</strong> Credits sind internes Guthaben aus <strong style="color:var(--text)">Discord-Giveaways</strong>. Kein Kauf, keine Auszahlung.</p></div>`}
function tix(){return S.get("tickets",[])}
function saveT(t){S.set("tickets",t)}
function msgs(){return S.get("messages",[])}
function saveM(m){S.set("messages",m)}
function pTickets(){const self=me();const list=tix().filter(t=>isStaff(self)||t.userId===self.id).sort((a,b)=>b.createdAt-a.createdAt);return`<div class="sh"><div class="st">Tickets</div><button class="btn btn-p btn-sm" id="new-tix" style="width:auto">+ Ticket</button></div>${list.length?`<div class="card"><table><thead><tr><th>Betreff</th><th>Status</th><th>Erstellt</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td><strong>${esc(t.subject)}</strong><div style="font-size:12px;color:var(--dim)">${esc(t.author)}</div></td><td><span class="badge ${t.status==="open"?"bon":"boff"}">${t.status==="open"?"Offen":"Geschlossen"}</span></td><td style="color:var(--muted);font-size:13px">${new Date(t.createdAt).toLocaleString("de-DE")}</td><td><button class="btn btn-g btn-sm" data-tix="${t.id}">Öffnen</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="card"><div class="empty"><h3>Keine Tickets</h3><p>Erstelle ein Ticket bei Bedarf.</p></div></div>`}`}
function pMsg(){const m=msgs().slice(-80);return`<div class="sh"><div class="st">Nachrichten</div></div><div class="card chat"><div class="cl" id="cl">${m.length?m.map(x=>`<div class="cr"><div class="av">${esc((x.author||"?").slice(0,2).toUpperCase())}</div><div><div style="font-size:12px"><strong>${esc(x.author)}</strong> <span style="color:var(--dim);font-size:11px">${new Date(x.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</span></div><div style="font-size:14px;color:var(--muted);margin-top:2px">${esc(x.text)}</div></div></div>`).join(""):`<div style="margin:auto;color:var(--dim);font-size:14px">Noch keine Nachrichten.</div>`}</div><div class="ci"><input id="mi" placeholder="Nachricht…"/><button class="btn btn-p" id="sm" style="width:auto">Senden</button></div></div><p class="note">Lokal gespeichert. Später WebSocket/Discord möglich.</p>`}
function pSet(){const u=me();return`<div class="sh"><div class="st">Einstellungen</div></div><div class="card pad"><label>Name</label><input id="sn" value="${esc(u?.name||"")}"/><label>E-Mail</label><input value="${esc(u?.email||"")}" disabled style="opacity:.55"/><button class="btn btn-p" id="ss" style="width:auto;margin-top:4px">Speichern</button></div><div style="margin-top:20px"><div class="sh"><div class="st">Pterodactyl API</div></div><div class="card pad"><p class="note" style="margin-top:0">Panel-URL + Client-API-Key. Produktion: Backend-Proxy.</p><label>Panel URL</label><input id="pu" placeholder="https://panel.example.com" value="${esc(PTERO.baseUrl)}"/><label>Client API Key</label><input id="pk" type="password" placeholder="ptlc_..." value="${esc(PTERO.apiKey)}"/><button class="btn btn-p" id="sp" style="width:auto">API speichern</button></div></div>`}
const PAGES={dashboard:{t:"Dashboard",r:pDash},servers:{t:"Server",r:pSrv},team:{t:"Team & Rollen",r:pTeam,s:1},users:{t:"Nutzer & Credits",r:pUsers,s:1},tickets:{t:"Tickets",r:pTickets},messages:{t:"Nachrichten",r:pMsg},credits:{t:"Guthaben",r:pCredits},settings:{t:"Einstellungen",r:pSet}};
function render(n){const p=PAGES[n]||PAGES.dashboard;if(p.s&&!isStaff()){toast("Kein Zugriff");return render("dashboard")}document.getElementById("pt").textContent=p.t;document.getElementById("ct").innerHTML=p.r();document.querySelectorAll(".nav-b").forEach(b=>b.classList.toggle("on",b.dataset.p===n));bind();closeSide()}
function bind(){document.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{toast("Befehl „"+b.dataset.sg+"“ gesendet");PTERO.power(b.dataset.pw,b.dataset.sg)});document.querySelectorAll("[data-ru]").forEach(s=>s.onchange=()=>{const list=users();const u=list.find(x=>x.id===s.dataset.ru);if(!u)return;u.role=s.value;saveU(list);toast("Rolle aktualisiert");render("team")});document.querySelectorAll("[data-cr]").forEach(b=>b.onclick=()=>openCredit(b.dataset.cr));const as=document.getElementById("add-staff");if(as)as.onclick=openStaff;const nt=document.getElementById("new-tix");if(nt)nt.onclick=openNewTix;document.querySelectorAll("[data-tix]").forEach(b=>b.onclick=()=>openTix(b.dataset.tix));const sm=document.getElementById("sm"),mi=document.getElementById("mi");if(sm&&mi){const send=()=>{const t=mi.value.trim();if(!t)return;const m=msgs();m.push({author:me().name,text:t,at:Date.now()});saveM(m);render("messages");setTimeout(()=>{const c=document.getElementById("cl");if(c)c.scrollTop=c.scrollHeight},20)};sm.onclick=send;mi.onkeydown=e=>{if(e.key==="Enter")send()}}const ss=document.getElementById("ss");if(ss)ss.onclick=()=>{const n=document.getElementById("sn").value.trim();if(!n)return toast("Name leer");const list=users();const u=list.find(x=>x.id===me().id);u.name=n;saveU(list);setSess(u);chip();toast("Gespeichert")};const sp=document.getElementById("sp");if(sp)sp.onclick=()=>{PTERO.baseUrl=document.getElementById("pu").value.trim().replace(/\\/$/,"");PTERO.apiKey=document.getElementById("pk").value.trim();S.set("ptero",{baseUrl:PTERO.baseUrl,apiKey:PTERO.apiKey});toast("API gespeichert")}}
function modal(h){const bg=document.createElement("div");bg.className="mbg";bg.innerHTML=`<div class="mod">${h}</div>`;document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()};return bg}
function openCredit(id){const u=users().find(x=>x.id===id);if(!u)return;const bg=modal(`<h2>Credits anpassen</h2><p>${esc(u.name)} · <strong>${(u.balance||0).toFixed(0)} Credits</strong><br><span style="font-size:12px;color:var(--dim)">Intern (Discord-Giveaways) — kein Echtgeld</span></p><label>Credits</label><input type="number" id="am" step="1" placeholder="100"/><div class="ma"><button class="btn btn-g" id="c">Abbrechen</button><button class="btn btn-p" id="o" style="width:auto">Speichern</button></div>`);bg.querySelector("#c").onclick=()=>bg.remove();bg.querySelector("#o").onclick=()=>{const a=parseFloat(bg.querySelector("#am").value);if(isNaN(a))return toast("Ungültig");const list=users();const t=list.find(x=>x.id===id);t.balance=Math.max(0,(t.balance||0)+a);saveU(list);toast((a>=0?"+":"")+a.toFixed(0)+" Credits");bg.remove();render("users")}}
function openStaff(){const bg=modal(`<h2>Team-Mitglied</h2><label>Name</label><input id="n"/><label>E-Mail</label><input id="e" type="email"/><label>Passwort</label><input id="p" type="password"/><label>Rolle</label><select id="r"><option value="admin">Admin</option><option value="technical">Technical</option><option value="developer">Developer</option></select><div class="ma"><button class="btn btn-g" id="c">Abbrechen</button><button class="btn btn-p" id="o" style="width:auto">Anlegen</button></div>`);bg.querySelector("#c").onclick=()=>bg.remove();bg.querySelector("#o").onclick=()=>{const n=bg.querySelector("#n").value.trim(),e=bg.querySelector("#e").value.trim(),p=bg.querySelector("#p").value,r=bg.querySelector("#r").value;if(!n||!e||p.length<6)return toast("Felder prüfen");if(find(e))return toast("E-Mail vergeben");const list=users();list.push({id:"u"+Date.now(),name:n,email:e,password:p,role:r,balance:0});saveU(list);toast(n+" angelegt");bg.remove();render("team")}}
function openNewTix(){const bg=modal(`<h2>Neues Ticket</h2><label>Betreff</label><input id="s"/><label>Nachricht</label><textarea id="b"></textarea><div class="ma"><button class="btn btn-g" id="c">Abbrechen</button><button class="btn btn-p" id="o" style="width:auto">Absenden</button></div>`);bg.querySelector("#c").onclick=()=>bg.remove();bg.querySelector("#o").onclick=()=>{const s=bg.querySelector("#s").value.trim(),b=bg.querySelector("#b").value.trim();if(!s||!b)return toast("Ausfüllen");const self=me();const list=tix();list.push({id:"t"+Date.now(),subject:s,body:b,status:"open",userId:self.id,author:self.name,createdAt:Date.now(),replies:[{author:self.name,text:b,at:Date.now()}]});saveT(list);toast("Ticket erstellt");bg.remove();render("tickets")}}
function openTix(id){const t=tix().find(x=>x.id===id);if(!t)return;const bg=modal(`<h2>${esc(t.subject)}</h2><p><span class="badge ${t.status==="open"?"bon":"boff"}">${t.status==="open"?"Offen":"Geschlossen"}</span></p><div style="max-height:180px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px">${(t.replies||[]).map(r=>`<div style="background:var(--elev);padding:10px;border-radius:10px"><div style="font-size:12px;color:var(--dim)"><strong style="color:var(--text)">${esc(r.author)}</strong> · ${new Date(r.at).toLocaleString("de-DE")}</div><div style="font-size:14px;margin-top:3px">${esc(r.text)}</div></div>`).join("")}</div>${t.status==="open"?`<label>Antwort</label><input id="rp"/><div class="ma"><button class="btn btn-g" id="cl">Schließen</button><button class="btn btn-p" id="rb" style="width:auto">Antworten</button></div>`:`<div class="ma"><button class="btn btn-g" id="cl">Schließen</button></div>`}`);const done=()=>{bg.remove();render("tickets")};bg.querySelector("#cl").onclick=()=>{if(t.status==="open"&&isStaff()){const list=tix();list.find(x=>x.id===id).status="closed";saveT(list);toast("Geschlossen")}done()};const rb=bg.querySelector("#rb");if(rb)rb.onclick=()=>{const text=bg.querySelector("#rp").value.trim();if(!text)return;const list=tix();const target=list.find(x=>x.id===id);target.replies=target.replies||[];target.replies.push({author:me().name,text,at:Date.now()});saveT(list);toast("Gesendet");bg.remove();openTix(id)}}
function chip(){const u=me();if(!u)return;document.getElementById("cn").textContent=u.name;document.getElementById("cr").textContent=ROLES[u.role]?.l||u.role;document.getElementById("av").textContent=(u.name||"?").slice(0,2).toUpperCase();document.body.classList.toggle("is-staff",isStaff(u))}
function showApp(){document.getElementById("auth").style.display="none";document.getElementById("app").classList.add("on");chip();render("dashboard")}
function showAuth(){document.getElementById("auth").style.display="flex";document.getElementById("app").classList.remove("on");document.body.classList.remove("is-staff")}
function err(id,m){const e=document.getElementById(id);e.textContent=m;e.classList.add("show")}
function hide(id){document.getElementById(id).classList.remove("show")}
function login(){hide("e1");const email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;if(!email||!pass)return err("e1","Bitte E-Mail und Passwort eingeben.");ensure();const user=find(email);if(!user||user.password!==pass)return err("e1","E-Mail oder Passwort falsch.");setSess(user);toast("Willkommen, "+user.name);showApp()}
function register(){hide("e2");const name=document.getElementById("rname").value.trim(),email=document.getElementById("remail").value.trim(),pass=document.getElementById("rpass").value;if(!name||!email||pass.length<6)return err("e2","Bitte alle Felder korrekt ausfüllen.");ensure();if(find(email))return err("e2","E-Mail bereits registriert.");const list=users();const user={id:"u"+Date.now(),name,email,password:pass,role:"user",balance:0};list.push(user);saveU(list);setSess(user);toast("Account erstellt");showApp()}
document.getElementById("btn-login").onclick=login;
document.getElementById("btn-reg").onclick=register;
document.getElementById("pass").onkeydown=e=>{if(e.key==="Enter")login()};
document.getElementById("email").onkeydown=e=>{if(e.key==="Enter")login()};
document.getElementById("to-reg").onclick=e=>{e.preventDefault();document.getElementById("v-login").style.display="none";document.getElementById("v-reg").style.display="block"};
document.getElementById("to-login").onclick=e=>{e.preventDefault();document.getElementById("v-reg").style.display="none";document.getElementById("v-login").style.display="block"};
document.getElementById("btn-out").onclick=()=>{clrSess();toast("Abgemeldet");showAuth()};
document.getElementById("btn-ref").onclick=()=>{const a=document.querySelector(".nav-b.on")?.dataset.p||"dashboard";render(a);toast("Aktualisiert")};
document.querySelectorAll(".nav-b").forEach(b=>b.onclick=()=>render(b.dataset.p));
const side=document.getElementById("side"),ov=document.getElementById("ov"),mt=document.getElementById("mt");
function openSide(){side.classList.add("open");ov.classList.add("open")}
function closeSide(){side.classList.remove("open");ov.classList.remove("open")}
mt.onclick=()=>side.classList.contains("open")?closeSide():openSide();
ov.onclick=closeSide;
ensure();
const cfg=S.get("ptero");if(cfg){PTERO.baseUrl=cfg.baseUrl||"";PTERO.apiKey=cfg.apiKey||""}
if(sess()&&me())showApp();else showAuth();
})();

</script>
</body>
</html>
